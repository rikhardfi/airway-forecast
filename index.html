<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Airway forecast | hengitystutkimus.fi</title>
  <meta name="description" content="Pick a training site and see where the airway drying limit falls in the forecast air against your training zones.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:wght@600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 4v10M16 14c-3 0-9 4-9 12 4 1 8-1 9-6M16 14c3 0 9 4 9 12-4 1-8-1-9-6' fill='none' stroke='%23235787' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
  <section class="page-hero">
    <div class="wrap">
      <h1 data-t="title">Airway forecast</h1>
      <p data-t="tagline"></p>
    </div>
  </section>

  <main class="wrap">
    <section class="card controls">
      <label class="f site"><span data-t="site"></span><select id="site"></select></label>
      <form id="searchForm" class="f search">
        <input id="search" type="search" autocomplete="off">
        <button type="submit" class="btn" data-t="searchBtn">Search</button>
      </form>
      <div id="found" class="found"></div>
      <label class="f"><span data-t="start"></span><select id="start"></select></label>
      <label class="f"><span data-t="duration"></span><input id="duration" type="number" min="10" max="480" step="10"></label>
      <label class="f"><span data-t="sex"></span><select id="sex"><option value="men" data-t="men">Men</option><option value="women" data-t="women">Women</option></select></label>
      <label class="f wide"><span data-t="intensity"></span><select id="intensity"></select></label>
      <label class="f" id="ownVeRow" hidden><span data-t="ownVe"></span><input id="ownVe" type="number" min="5" max="300" step="5"></label>
    </section>

    <nav id="days" class="days card" aria-label="Days"></nav>
    <p id="status" class="status" hidden></p>

    <section id="result" class="result" hidden>
      <div class="card">
        <h2 data-t="chartTitle"></h2>
        <p id="chartWhen" class="small"></p>
        <p class="lead2" data-t="chartLead"></p>
        <div id="chart" class="chart"></div>
        <ul id="legend" class="legend"></ul>
        <p id="best" class="best-line"></p>
      </div>

      <div class="card">
        <h2 data-t="sessionTitle"></h2>
        <dl id="vals" class="vals"></dl>
      </div>
    </section>

    <footer class="foot small">
      <p id="method"></p>
      <p><a href="https://open-meteo.com/" data-t="credit"></a></p>
    </footer>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
